<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
	<meta name="description"
		content="Free disposable email service powered by serverless kittens. Get temporary email addresses instantly.">

	<!-- PWA Meta Tags -->
	<meta name="theme-color" content="#4F46E5">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Akunlama">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="application-name" content="Akunlama">
	<meta name="msapplication-TileColor" content="#4F46E5">
	<meta name="msapplication-tap-highlight" content="no">

	<!-- Open Graph -->
	<meta property="og:title" content="Akunlama" />
	<meta property="og:url" content="https://akunlama.com" />
	<meta property="og:type" content="website" />
	<meta property="og:description" content="An Open-source Disposable Email (powered by serverless kittens 🐱)" />
	<meta property="og:image" content="https://akunlama.com/static/inbox-kitten-opengraph.jpg" />

	<!-- Twitter -->
	<meta property="twitter:card" content="summary" />
	<meta property="twitter:title" content="Akunlama" />
	<meta property="twitter:url" content="https://akunlama.com" />
	<meta property="twitter:site:id" content="@akunlama" />
	<meta property="twitter:description" content="An Open-source Disposable Email (powered by serverless kittens 🐱)" />
	<meta property="twitter:image" content="https://akunlama.com/static/inbox-kitten-opengraph.jpg" />

	<title>Akunlama - Disposable Email</title>

	<!-- Favicon -->
	<link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon" />
	<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/icon-16x16.png">

	<!-- Apple Touch Icons -->
	<link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
	<link rel="apple-touch-icon" sizes="152x152" href="/static/icons/icon-152x152.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-180x180.png">
	<link rel="apple-touch-icon" sizes="167x167" href="/static/icons/icon-167x167.png">

	<!-- Web App Manifest -->
	<link rel="manifest" href="/manifest.json">

	<!-- Splash screens for iOS -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<link rel="apple-touch-startup-image" href="/static/splash/splash-640x1136.png"
		media="(device-width: 320px) and (device-height: 568px)">
	<link rel="apple-touch-startup-image" href="/static/splash/splash-750x1334.png"
		media="(device-width: 375px) and (device-height: 667px)">
	<link rel="apple-touch-startup-image" href="/static/splash/splash-1242x2208.png"
		media="(device-width: 414px) and (device-height: 736px)">
	<link rel="apple-touch-startup-image" href="/static/splash/splash-1125x2436.png"
		media="(device-width: 375px) and (device-height: 812px)">

	<!-- Preconnect to API domain for faster requests -->
	<link rel="preconnect" href="https://akunlama.com">
	<link rel="dns-prefetch" href="https://akunlama.com">
</head>

<body>
	<div id="app"></div>
	<script type="module" src="/src/main.ts"></script>

	<!-- Register Service Worker -->
	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('/sw.js')
					.then((registration) => {
						console.log('SW registered:', registration.scope);
					})
					.catch((error) => {
						console.log('SW registration failed:', error);
					});
			});
		}
	</script>
</body>

</html>
