# wrangler.toml - Cloudflare Worker configuration for akunlama
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "akunlama-prod"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database binding
# Using akunlama database for production
[[d1_databases]]
binding = "DB"
database_name = "akunlama"
database_id = "f71f4888-5156-49d2-a679-17aae49f2600"

# Scheduled cron trigger for email cleanup
# Runs every 12 hours (midnight and noon UTC) to delete emails older than 3 days
[triggers]
crons = ["0 0,12 * * *"]

# Environment variables (non-sensitive)
# For sensitive values like ADMIN_ACCESS_KEY, use:
# npx wrangler secret put ADMIN_ACCESS_KEY
[vars]
EMAIL_DOMAIN = "akunlama.com"

# Optional: Banned usernames (comma-separated)
# BANNED_USERNAMES = "admin,postmaster,abuse,root"

# Optional: Additional blocked keywords for email filtering
BLOCKED_SENDER_KEYWORDS = "newsletter,birthdays@facebookmail.com,memories@facebookmail.com,notification@service.tiktok.com,messages@facebookmail.com,stories-recap@mail.instagram.com,posts-recap@mail.instagram.com,follow-suggestions@mail.instagram.com,friendsuggestion@facebookmail.com,reminders@facebookmail.com,groupupdates@facebookmail.com,pageupdates@facebookmail.com,notification@facebookmail.com,friendupdates@facebookmail.com"
BLOCKED_SUBJECT_KEYWORDS = "lainnya di beranda Anda,lihat apa yang sedang terjadi,unread message,lihat kembali momen,membangikan postingan baru,catch up on moments,been happening on Instagram,more in your feed,started following you,pesan yang belum dibaca,melihat reel dari,shared something new,Pesan penting tentang,anlara göz at,Anda memiliki pesan,added to their stories,yang Anda lewatkan,otros en tu feed,pilihan dari jaringan Anda,pembaruan populer dari,commented on a post,berkomentar ::,Apakah Anda kenal,menyukai postingan Anda,pembaruan untuk Anda,saran Grup baru untuk Anda,postingan pop uler,pemberitahuan baru,new notifications,is a suggestion,foto baru,teman baru untuk Anda,dan lainnya"
# BLOCKED_BODY_KEYWORDS = "click here to claim"

# ============================================
# DEPLOYMENT COMMANDS
# ============================================
# 
# First-time setup:
# 1. Login to Cloudflare: npx wrangler login
# 2. Create D1 database: npx wrangler d1 create akunlama-emails
# 3. Update database_id above with the ID from step 2
# 4. Initialize database schema:
#    npx wrangler d1 execute akunlama-emails --file=./schema.sql
# 5. Set secrets:
#    npx wrangler secret put ADMIN_ACCESS_KEY
#
# Deployment:
# npx wrangler deploy
#
# Local development:
# npx wrangler dev
#
# View logs:
# npx wrangler tail
# ============================================
